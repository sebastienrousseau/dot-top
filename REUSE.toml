# REUSE 3.3: covers files that cannot carry an SPDX comment (go.mod,
# licence texts, Markdown). Source files carry their own headers, which win.
version = 1
SPDX-PackageName = "dot-top"
SPDX-PackageDownloadLocation = "https://github.com/sebastienrousseau/dot-top"

[[annotations]]
path = ["**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Sebastien Rousseau"
SPDX-License-Identifier = "Apache-2.0 OR MIT"
